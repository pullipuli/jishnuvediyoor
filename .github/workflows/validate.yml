# Build and check the site for every pull request into main.
# Uses the same Hugo version, image preparation and build flags as hugo.yml (deployment).
name: Validate Hugo site

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
      SITE_URL: https://jishnuvediyoor.com/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -nv -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum --check
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl imagemagick

      - name: Shrink large images and strip GPS location
        run: scripts/prepare-images.sh static/images

      - name: Build site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --baseURL "${SITE_URL}"

      - name: Check generated site
        run: python3 scripts/check-site.py public "${SITE_URL}"
