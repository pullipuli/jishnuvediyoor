# Build and deploy the Hugo site to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Shrink large images and strip GPS location
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl imagemagick
          # Published copies only: cap at 2000px on the long side (originals stay in git).
          find static/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +500k -exec mogrify -resize '2000x2000>' -quality 85 {} + || true
          find static/images -type f -iname '*.png' -size +500k -exec mogrify -resize '2000x2000>' {} + || true
          exiftool -q -r -overwrite_original -gps:all= -ext jpg -ext jpeg -ext png -ext webp static/images || true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Pages may report http:// while HTTPS enforcement is off; publish HTTPS asset URLs.
          hugo --minify --baseURL "${PAGES_BASE_URL/#http:/https:}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
