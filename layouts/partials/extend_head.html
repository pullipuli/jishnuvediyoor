<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Floating nav dock, same as the homepage's */
  .navdock{position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:50;
    display:flex; align-items:center; gap:2px; padding:6px; border-radius:999px; background:rgba(14,13,15,0.68);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,0.08); box-shadow:0 12px 34px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);
    animation:navdock-in .6s cubic-bezier(.2,.75,.2,1) .15s both}
  .navdock a{font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:500; line-height:1.5; color:#9C988E; text-decoration:none;
    padding:10px 18px; border-radius:999px; box-shadow:none; transition:color .2s ease, background .2s ease; white-space:nowrap}
  .navdock a:hover{color:#EDE9DF}
  .navdock a:focus-visible{outline:2px solid #BD7C34; outline-offset:2px}
  .navdock a.active{color:#EDE9DF; background:rgba(255,255,255,0.1)}
  .navdock a.active::before{content:""; display:inline-block; width:5px; height:5px; border-radius:50%; background:#BD7C34; margin-right:7px; vertical-align:middle}
  @keyframes navdock-in{from{opacity:0; translate:0 24px} to{opacity:1; translate:0 0}}
  @media (max-width:600px){
    .navdock{left:12px; right:12px; transform:none; justify-content:flex-start; overflow-x:auto; scrollbar-width:none;
      bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
    .navdock::-webkit-scrollbar{display:none}
    .navdock a{padding:8px 14px; font-size:13px; flex:none}
  }
  @media (prefers-reduced-motion:reduce){ .navdock{animation:none} }
  /* keep page content and the go-to-top button clear of the dock */
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  .top-link{bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
</style>
