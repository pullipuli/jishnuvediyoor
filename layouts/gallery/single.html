{{ define "main" }}
<div style="max-width:760px;margin:0 auto;padding:60px 24px;font-family:'IBM Plex Sans',sans-serif;color:#17161C;">
  <a href="/gallery/" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8F5A22;text-decoration:none;">&larr; Back to gallery</a>
  <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width:100%;border-radius:14px;margin:20px 0;">
  <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;margin:0 0 8px;">{{ .Title }}</h1>
  <p style="color:#5C5A63;">{{ .Params.caption }}</p>
</div>
{{ end }}
