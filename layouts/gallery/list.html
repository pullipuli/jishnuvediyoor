{{ define "main" }}
<div style="max-width:960px;margin:0 auto;padding:60px 24px;font-family:'IBM Plex Sans',sans-serif;color:#17161C;">
  <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:#98958E;">GALLERY</span>
  <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;margin:6px 0 24px;">Photography</h1>

  <div id="filters" style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
    <span class="filter-pill active" data-tag="all" style="cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 14px;border-radius:999px;background:#17161C;color:#F6F4EE;">All</span>
    {{ $tags := slice }}
    {{ range .Pages }}
      {{ range .Params.tags }}
        {{ $tags = $tags | append . }}
      {{ end }}
    {{ end }}
    {{ range ($tags | uniq | sort) }}
    <span class="filter-pill" data-tag="{{ . }}" style="cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid #DEDACE;color:#5C5A63;">{{ . }}</span>
    {{ end }}
  </div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="gallery-item" data-tags="{{ delimit .Params.tags "," }}" style="display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid #E0DACB;text-decoration:none;">
      <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width:100%;height:100%;object-fit:cover;display:block;">
    </a>
    {{ end }}
  </div>
</div>

<style>
  @media (max-width:700px){ #grid{ grid-template-columns:repeat(2,1fr); } }
</style>

<script>
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(p => {
        p.style.background = 'transparent';
        p.style.color = '#5C5A63';
        p.style.border = '1px solid #DEDACE';
      });
      pill.style.background = '#17161C';
      pill.style.color = '#F6F4EE';
      pill.style.border = 'none';

      const tag = pill.dataset.tag;
      document.querySelectorAll('.gallery-item').forEach(item => {
        const tags = item.dataset.tags.split(',');
        item.style.display = (tag === 'all' || tags.includes(tag)) ? 'block' : 'none';
      });
    });
  });
</script>
{{ end }}
