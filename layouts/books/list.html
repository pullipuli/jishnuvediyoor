{{ define "main" }}
<div style="max-width:960px;margin:0 auto;padding:60px 24px;font-family:'IBM Plex Sans',sans-serif;color:#17161C;">
  <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:#98958E;">READING</span>
  <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;margin:6px 0 24px;">Books</h1>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
    {{ range .Pages.ByDate.Reverse }}
    <a href="{{ .RelPermalink }}" style="text-decoration:none;color:inherit;">
      <div style="aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid #E0DACB;">
        <img src="{{ .Params.coverimg }}" alt="{{ .Title }}" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <div style="font-size:13px;margin-top:6px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;">{{ .Title }}</div>
      <div style="font-size:11px;color:#5C5A63;">{{ .Params.author }}</div>
      <div style="font-size:11px;color:#8F5A22;">{{ "★" | strings.Repeat .Params.rating }}</div>
    </a>
    {{ end }}
  </div>
</div>
<style>@media (max-width:700px){ div[style*="repeat(4"]{ grid-template-columns:repeat(2,1fr) !important; } }</style>
{{ end }}
